    <ellipse cx="290" cy="172" rx="280" ry="12" fill="url(#floorGrad)" class="floor-glow" />

    <!-- SERVER RACK 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="152" rx="6" fill="url(#rackFront)" stroke="#30363d" stroke-width="1.2" />
      <!-- Top Cap -->
      <path d="M0 6C0 2.7 2.7 0 6 0H50C53.3 0 56 2.7 56 6V14H0V6Z" fill="#21262d" />
      <circle cx="10" cy="7" r="1.8" class="led-cyan" />
      <circle cx="17" cy="7" r="1.8" class="led-green" />
      <!-- Blades -->
      <rect x="6" y="20" width="44" height="20" rx="3" fill="#161b22" stroke="#30363d" />
      <circle cx="14" cy="30" r="2" class="led-cyan" />
      <circle cx="21" cy="30" r="1.5" fill="#475569" />

      <rect x="6" y="44" width="44" height="20" rx="3" fill="#161b22" stroke="#30363d" />
