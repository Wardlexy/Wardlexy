<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ward Data Center Profile Banner</title>
  <desc id="desc">A futuristic Data Center banner featuring 8 illuminated 3D isometric server racks, neon LED animations, and HUD telemetry.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Inter:wght@900&amp;display=swap');
      
      .brand-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 62px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: -0.04em;
      }

      .hud-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #38bdf8;
      }

      .hud-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        fill: #8b949e;
      }

      /* Animated LED Blinking Keyframes */
      @keyframes blink1 {
        0%, 100% { fill: #38bdf8; opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        50% { fill: #1e293b; opacity: 0.3; filter: none; }
      }

      @keyframes blink2 {
        0%, 100% { fill: #34d399; opacity: 0.9; filter: drop-shadow(0 0 3px #34d399); }
        40% { fill: #064e3b; opacity: 0.2; filter: none; }
      }

      @keyframes blink3 {
        0%, 100% { fill: #60a5fa; opacity: 1; filter: drop-shadow(0 0 4px #60a5fa); }
        60% { fill: #1e3a8a; opacity: 0.3; filter: none; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      .led-cyan { animation: blink1 2.2s infinite ease-in-out; }
      .led-green { animation: blink2 1.8s infinite ease-in-out; }
      .led-blue { animation: blink3 2.7s infinite ease-in-out; }
      .floor-glow { animation: pulseGlow 4s infinite ease-in-out; }
    </style>

    <!-- Gradients for Floor & Rack Illumination -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rackFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="900" height="240" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- GRID BACKGROUND PATTERN -->
  <path d="M0 40H900 M0 80H900 M0 120H900 M0 160H900 M0 200H900" stroke="#161b22" stroke-width="1" stroke-dasharray="4 4" />

  <!-- LEFT BRANDING & HUD SECTION -->
  <g transform="translate(48, 48)">
    <!-- macOS Window Traffic Lights -->
    <circle cx="0" cy="0" r="5.5" fill="#ff5f56" />
    <circle cx="16" cy="0" r="5.5" fill="#ffbd2e" />
    <circle cx="32" cy="0" r="5.5" fill="#27c93f" />

    <!-- Brand Name -->
    <text class="brand-title" x="-2" y="62">Ward</text>

    <!-- Data Center Telemetry Box -->
    <g transform="translate(0, 84)">
      <rect x="-4" y="0" width="220" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#34d399" class="led-green" />
      <text class="hud-text" x="26" y="19">DATA CENTER // NODE-01</text>
      <text class="hud-sub" x="14" y="34">99.99% UPTIME · 18°C COOLING</text>
    </g>

    <!-- Footer Tag -->
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#484f58" x="0" y="156">PROFILE / README</text>
  </g>

  <!-- RIGHT DATA CENTER ISOMETRIC SERVER RACKS (8 RACKS) -->
  <g transform="translate(290, 36)">
